<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="18%" r="64%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="headset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6fffa" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#022c22" flood-opacity="0.28" />
    </filter>
    <filter id="glyphShadow" x="-18%" y="-18%" width="136%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#034836" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- 渐变圆角方框主体 -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="28" width="448" height="448" rx="108" fill="url(#bg)" />
    <rect x="32" y="28" width="448" height="448" rx="108" fill="url(#glow)" />
    <rect x="35" y="31" width="442" height="442" rx="105" fill="none" stroke="url(#rim)" stroke-width="6" />
  </g>

  <!-- 背景柔光磨砂对话气泡 -->
  <path d="M126 120 h240 a56 56 0 0 1 56 56 v132 a56 56 0 0 1 -56 56 h-118 l-56 44 a10 10 0 0 1 -16 -8 v-36 h-50 a56 56 0 0 1 -56 -56 v-132 a56 56 0 0 1 56 -56 z"
        fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />

  <!-- 立体白玉耳麦图标 -->
  <g filter="url(#glyphShadow)">
    <!-- 头梁 -->
    <path d="M142 260 v-22 a106 106 0 0 1 212 0 v22" fill="none" stroke="url(#headset)" stroke-width="28" stroke-linecap="round" />
    <!-- 左耳罩 -->
    <rect x="114" y="232" width="54" height="98" rx="27" fill="url(#headset)" />
    <!-- 右耳罩 -->
    <rect x="328" y="232" width="54" height="98" rx="27" fill="url(#headset)" />
    <!-- 柔和麦克风弧臂 + 拾音胶囊 -->
    <path d="M354 320 v12 a48 48 0 0 1 -48 48 h-34" fill="none" stroke="url(#headset)" stroke-width="20" stroke-linecap="round" />
    <rect x="228" y="366" width="56" height="28" rx="14" fill="url(#headset)" />
    <!-- 中心三点消息律动 -->
    <circle cx="212" cy="274" r="11" fill="#ffffff" fill-opacity="0.92" />
    <circle cx="248" cy="274" r="11" fill="#ffffff" fill-opacity="0.92" />
    <circle cx="284" cy="274" r="11" fill="#ffffff" fill-opacity="0.92" />
  </g>

  <!-- 右下角悬浮在线徽章 -->
  <g filter="url(#glyphShadow)">
    <circle cx="394" cy="390" r="48" fill="#ffffff" />
    <circle cx="394" cy="390" r="30" fill="url(#badgeGrad)" />
    <circle cx="384" cy="380" r="8" fill="#ffffff" fill-opacity="0.65" />
  </g>
</svg>
